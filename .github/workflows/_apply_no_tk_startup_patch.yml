name: Apply no-Tk startup packaging patch

on:
  push:
    branches:
      - fix/v2.4.2-native-startup-no-tk
    paths:
      - '.github/workflows/_apply_no_tk_startup_patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2.4.2-native-startup-no-tk
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/_apply_no_tk_startup_patch.py
      - run: python -m py_compile app/main_desktop.py
      - shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add EstadoCuentaEngine.spec
          git diff --cached --quiet && exit 0
          git commit -m 'fix: remove Tcl/Tk splash from packaged startup'
          git push origin HEAD:fix/v2.4.2-native-startup-no-tk
