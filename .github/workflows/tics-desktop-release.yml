name: TICS desktop release

on:
  workflow_dispatch:
    inputs:
      release_label:
        description: "Etiqueta de la compilación (ej. 2.4.1-rc1)"
        required: false
        default: "manual"
      include_paddle_models:
        description: "Incluir modelos oficiales PaddleOCR y su instalador offline"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-windows-desktop:
    name: Windows desktop + OCR completo
    runs-on: windows-latest
    env:
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install full desktop runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop,paddleocr]"
          python -m pip install --group packaging

      - name: Verify OCR runtimes
        shell: pwsh
        run: |
          python -c "import flet, paddle, paddleocr, pytesseract; print('Flet/PaddleOCR/Tesseract Python bridge OK'); print('PaddlePaddle', paddle.__version__); print('PaddleOCR', paddleocr.__version__)"
          if (-not (Test-Path "vendor/tesseract/tesseract.exe")) {
            throw "No se encontró el runtime Tesseract versionado."
          }

      - name: Compile application sources
        run: python -m compileall -q app src scripts

      - name: Run non-integration regression suite
        run: python -m pytest -m "not integration" -q

      - name: Build institutional desktop executable
        run: pyinstaller --clean --noconfirm EstadoCuentaEngine.spec

      - name: Verify bundled PaddleX OCR pipeline
        shell: pwsh
        run: |
          $exe = "dist/Extractor_de_Movimientos_Financieros.exe"
          if (-not (Test-Path $exe)) {
            throw "No se generó el ejecutable esperado."
          }
          $process = Start-Process -FilePath $exe -ArgumentList "--self-test-paddlex-pipeline" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "El EXE no pudo cargar la pipeline OCR de PaddleX (ExitCode=$($process.ExitCode))."
          }

      - name: Verify release executable
        shell: pwsh
        run: |
          $exe = "dist/Extractor_de_Movimientos_Financieros.exe"
          python scripts/verify_windows_release.py `
            $exe `
            --output-dir dist `
            --version "2.4.1"
          "${{ inputs.release_label }}" | Out-File -Encoding utf8 "dist/release-label.txt"

      - name: Prepare verified PaddleOCR model bundle
        if: ${{ inputs.include_paddle_models }}
        shell: pwsh
        run: |
          python scripts/preparar_modelos_paddleocr.py `
            --destino "dist/models/paddleocr" `
            --fuente bos `
            --probar-inferencia
          Copy-Item "scripts/instalar_modelos_paddleocr.ps1" "dist/instalar_modelos_paddleocr.ps1" -Force

      - name: Create deployment note
        shell: pwsh
        run: |
          @"
          Extractor de Movimientos Financieros - compilación TICS

          El ejecutable incluye Flet, Tesseract y el runtime Python de PaddleOCR.
          PaddleOCR no descarga modelos durante el procesamiento de estados de cuenta.

          Si esta entrega contiene la carpeta models/paddleocr:
          1. ejecutar instalar_modelos_paddleocr.ps1 con privilegios de despliegue;
          2. el script copiará los modelos a %PROGRAMDATA%\EstadoCuentaEngine\PaddleOCR;
          3. no es necesario configurar variables de entorno para el uso normal.

          El archivo models/paddleocr/paddleocr-models-manifest.json registra hashes,
          tamaños y versiones del runtime del bundle preparado en CI.

          Verificar el SHA-256 y release-manifest.json antes de distribuir el binario.
          Si la política institucional lo requiere, aplicar firma de código antes de producción.
          "@ | Out-File -Encoding utf8 "dist/LEEME_TICS.txt"

      - name: Upload TICS deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: tics-desktop-${{ inputs.release_label }}
          path: |
            dist/Extractor_de_Movimientos_Financieros.exe
            dist/Extractor_de_Movimientos_Financieros.sha256.txt
            dist/release-manifest.json
            dist/release-label.txt
            dist/LEEME_TICS.txt
            dist/instalar_modelos_paddleocr.ps1
            dist/models/paddleocr/**
          if-no-files-found: warn
          retention-days: 30