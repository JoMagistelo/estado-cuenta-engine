name: TICS desktop release

on:
  workflow_dispatch:
    inputs:
      release_label:
        description: "Etiqueta de la compilación (ej. 2.4.2-rc1)"
        required: false
        default: "manual"

permissions:
  contents: read

jobs:
  build-windows-desktop:
    name: Windows portable offline + OCR completo
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "1"
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install full desktop runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop,paddleocr]"
          python -m pip install --group packaging

      - name: Verify OCR runtimes
        shell: pwsh
        run: |
          python -c "import flet, paddle, paddleocr, paddlex, pytesseract; print('Flet/PaddleOCR/Tesseract Python bridge OK'); print('PaddlePaddle', paddle.__version__); print('PaddleOCR', paddleocr.__version__)"
          if (-not (Test-Path "vendor/tesseract/tesseract.exe")) {
            throw "No se encontró el runtime Tesseract versionado."
          }

      - name: Compile application sources
        run: python -m compileall -q app src scripts

      - name: Run non-integration regression suite
        run: python -m pytest -m "not integration" -q

      - name: Build verified portable offline desktop
        shell: pwsh
        run: |
          .\scripts\build_windows_release.ps1 `
            -Python python `
            -PortableOffline `
            -AllowPaddleModelDownload `
            -SkipTests

      - name: Re-run strict embedded OCR tests
        shell: pwsh
        run: |
          $exe = "dist/Extractor_de_Movimientos_Financieros.exe"
          if (-not (Test-Path $exe)) {
            throw "No se generó el ejecutable esperado."
          }

          $paddlex = Start-Process `
            -FilePath $exe `
            -ArgumentList "--self-test-paddlex-pipeline" `
            -Wait `
            -PassThru
          if ($paddlex.ExitCode -ne 0) {
            throw "El EXE no pudo validar PaddleX (ExitCode=$($paddlex.ExitCode))."
          }

          $portable = Start-Process `
            -FilePath $exe `
            -ArgumentList "--self-test-portable-paddleocr-runtime" `
            -Wait `
            -PassThru
          if ($portable.ExitCode -ne 0) {
            throw "El EXE no pudo inferir con sus modelos PaddleOCR embebidos (ExitCode=$($portable.ExitCode))."
          }

      - name: Add release label
        shell: pwsh
        run: |
          "${{ inputs.release_label }}" | Out-File -Encoding utf8 "dist/release-label.txt"

      - name: Create TICS deployment note
        shell: pwsh
        run: |
          @"
          Extractor de Movimientos Financieros - compilación TICS

          PERFIL DESKTOP PORTABLE OFFLINE

          El archivo Extractor_de_Movimientos_Financieros.exe contiene:
          - interfaz Flet;
          - motor de extracción;
          - Tesseract y tessdata;
          - PaddlePaddle/PaddleOCR/PaddleX;
          - modelos PP-OCRv5_mobile_det y latin_PP-OCRv5_mobile_rec.

          La persona usuaria final sólo necesita el EXE. No debe instalar Python,
          PaddleOCR, Tesseract, modelos ni ejecutar scripts auxiliares.

          Durante la construcción se permitió adquisición de modelos oficiales sólo
          en el runner de CI. El runtime del EXE fuerza operación local y no descarga
          modelos durante el procesamiento.

          Antes de publicar, CI comprobó dentro del EXE real:
          - configuración y metadata OCR de PaddleX;
          - resolución de ambos modelos desde sys._MEIPASS/models/paddleocr;
          - una llamada real a PaddleOCR predict().

          paddleocr-models-manifest.json queda como evidencia de hashes, tamaños y
          versiones de los modelos embebidos. No necesita distribuirse al usuario.

          Verificar SHA-256 y release-manifest.json antes de distribuir el binario.
          Si la política institucional lo requiere, aplicar firma de código antes de producción.

          Streamlit es un despliegue de servidor separado y debe ejecutarse mediante
          scripts/run_streamlit_offline.ps1 o configuración equivalente de TIC.
          "@ | Out-File -Encoding utf8 "dist/LEEME_TICS.txt"

      - name: Upload TICS portable deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: tics-desktop-portable-${{ inputs.release_label }}
          path: |
            dist/Extractor_de_Movimientos_Financieros.exe
            dist/Extractor_de_Movimientos_Financieros.sha256.txt
            dist/release-manifest.json
            dist/paddleocr-models-manifest.json
            dist/release-label.txt
            dist/LEEME_TIC.txt
            dist/LEEME_TICS.txt
          if-no-files-found: error
          retention-days: 30
