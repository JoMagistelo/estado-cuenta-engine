name: Apply temporary Flet OCR trace patch

on:
  push:
    branches:
      - fix/flet-collapsible-validations-ocr-trace
    paths:
      - '.github/workflows/_apply-flet-ocr-trace-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/flet-collapsible-validations-ocr-trace
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply patch
        run: python scripts/_apply_flet_ocr_trace_patch.py
      - name: Compile changed Python files
        run: python -m py_compile app/main_flet.py src/engine/ocr_fallback_policy.py src/models/processing_result.py src/engine/pipeline.py
      - name: Commit patched sources
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/main_flet.py src/engine/ocr_fallback_policy.py src/models/processing_result.py src/engine/pipeline.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix: improve Flet audit and OCR fallback trace'
          git push origin HEAD:fix/flet-collapsible-validations-ocr-trace
