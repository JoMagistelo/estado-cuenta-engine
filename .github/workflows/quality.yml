name: Production readiness

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and quality tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install --group dev

      - name: Compile all Python sources
        run: python -m compileall -q app src tests

      - name: Static correctness checks
        run: ruff check .

      - name: Unit and synthetic regression suite
        run: pytest -m "not integration" -q

      - name: Build Python package
        run: python -m build

  security-audit:
    name: Dependency and integrity evidence
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install complete application and audit tooling
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[streamlit,desktop]"
          python -m pip install --group dev

      - name: Create dependency inventory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "build/security" | Out-Null
          python -m pip list --format=json | Out-File -Encoding utf8 "build/security/python-packages.json"
          python -m pip freeze --all | Out-File -Encoding utf8 "build/security/python-packages.txt"

      - name: Audit known Python vulnerabilities
        shell: pwsh
        run: |
          python -m pip_audit --local --strict --progress-spinner off --format json --output "build/security/pip-audit.json"

      - name: Record vendored Tesseract integrity
        shell: pwsh
        run: |
          $path = "vendor/tesseract/tesseract.exe"
          if (-not (Test-Path $path)) {
            throw "No se encontró el runtime Tesseract versionado."
          }
          $hash = Get-FileHash $path -Algorithm SHA256
          "$($hash.Hash.ToLower())  $path" | Out-File -Encoding ascii "build/security/tesseract.sha256.txt"

      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-evidence
          path: build/security/
          if-no-files-found: warn
          retention-days: 30

  ui-smoke:
    name: UI dependency smoke tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install UI extras
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[streamlit,desktop]"

      - name: Verify UI dependencies and sources
        shell: pwsh
        run: |
          python -c "import flet, pandas, streamlit; print('UI dependencies OK')"
          python -m compileall -q app

  container-smoke:
    name: OCI container build and health check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build container image
        run: docker build --tag estado-cuenta-engine:ci .

      - name: Start container
        run: docker run --detach --name estado-cuenta-engine-ci --publish 8501:8501 estado-cuenta-engine:ci

      - name: Verify Streamlit health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs estado-cuenta-engine-ci
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs estado-cuenta-engine-ci || true

      - name: Stop container
        if: always()
        run: docker rm --force estado-cuenta-engine-ci || true

  desktop-build:
    name: PyInstaller Windows build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install desktop and packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop]"
          python -m pip install --group packaging

      - name: Build desktop executable
        run: pyinstaller --clean --noconfirm EstadoCuentaEngine.spec

      - name: Verify executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/Extractor_de_Movimientos_Financieros.exe")) {
            throw "No se generó el ejecutable esperado."
          }

      - name: Generate executable integrity manifest
        shell: pwsh
        run: |
          $path = "dist/Extractor_de_Movimientos_Financieros.exe"
          $hash = Get-FileHash $path -Algorithm SHA256
          "$($hash.Hash.ToLower())  Extractor_de_Movimientos_Financieros.exe" | Out-File -Encoding ascii "dist/Extractor_de_Movimientos_Financieros.sha256.txt"

      - name: Upload build evidence
        uses: actions/upload-artifact@v4
        with:
          name: desktop-build-evidence
          path: dist/Extractor_de_Movimientos_Financieros.sha256.txt
          if-no-files-found: error
          retention-days: 30
