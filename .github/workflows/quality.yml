name: Production readiness

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and quality tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install --group dev

      - name: Compile all Python sources
        run: python -m compileall -q app src tests scripts

      - name: Verify diagnostic CLI
        run: |
          python scripts/diagnostico_paddleocr.py --help
          python scripts/preparar_modelos_paddleocr.py --help

      - name: Static correctness checks
        run: ruff check .

      - name: Unit and synthetic regression suite
        run: pytest -m "not integration" -q

      - name: Build Python package
        run: python -m build

  paddle-model-smoke:
    name: PaddleOCR models + real inference
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install PaddleOCR runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[paddleocr]"

      - name: Bootstrap official models and run real inference
        shell: pwsh
        run: |
          python scripts/preparar_modelos_paddleocr.py `
            --destino "build/paddle-models" `
            --fuente bos `
            --probar-inferencia
          if (-not (Test-Path "build/paddle-models/paddleocr-models-manifest.json")) {
            throw "No se generó el manifiesto de modelos PaddleOCR."
          }

      - name: Upload PaddleOCR model evidence
        uses: actions/upload-artifact@v4
        with:
          name: paddleocr-model-evidence
          path: build/paddle-models/paddleocr-models-manifest.json
          if-no-files-found: error
          retention-days: 30

  security-audit:
    name: Runtime PaddleOCR / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install deployable application dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[streamlit,desktop,paddleocr]"

      - name: Verify local Paddle runtime imports
        shell: pwsh
        run: |
          python -c "import paddle, paddleocr; print('Python runtime OK'); print('PaddlePaddle', paddle.__version__); print('PaddleOCR', paddleocr.__version__)"

      - name: Create runtime dependency inventory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "build/security" | Out-Null
          python -m pip list --format=json | Out-File -Encoding utf8 "build/security/python-packages.json"
          python -m pip freeze | Where-Object { $_ -notmatch '^-e\s' } | Out-File -Encoding ascii "build/security/runtime-requirements.txt"

      - name: Install audit tool
        run: python -m pip install "pip-audit>=2.9,<3"

      - name: Audit known runtime vulnerabilities
        shell: pwsh
        run: |
          python -m pip_audit --requirement "build/security/runtime-requirements.txt" --no-deps --strict --progress-spinner off --format json --output "build/security/pip-audit.json"

      - name: Record vendored Tesseract integrity
        shell: pwsh
        run: |
          $path = "vendor/tesseract/tesseract.exe"
          if (-not (Test-Path $path)) {
            throw "No se encontró el runtime Tesseract versionado."
          }
          $hash = Get-FileHash $path -Algorithm SHA256
          "$($hash.Hash.ToLower())  $path" | Out-File -Encoding ascii "build/security/tesseract.sha256.txt"

      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-evidence-python-${{ matrix.python-version }}
          path: build/security/
          if-no-files-found: warn
          retention-days: 30

  ui-smoke:
    name: UI dependency smoke tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install UI extras
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[streamlit,desktop]"

      - name: Verify UI dependencies and sources
        shell: pwsh
        run: |
          python -c "import flet, pandas, streamlit; print('UI dependencies OK')"
          python -m compileall -q app

  desktop-build:
    name: PyInstaller Windows build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install full desktop and packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop,paddleocr]"
          python -m pip install --group packaging

      - name: Build desktop executable
        run: pyinstaller --clean --noconfirm EstadoCuentaEngine.spec

      - name: Verify bundled PaddleX OCR pipeline
        shell: pwsh
        run: |
          $path = "dist/Extractor_de_Movimientos_Financieros.exe"
          if (-not (Test-Path $path)) {
            throw "No se generó el ejecutable esperado."
          }
          $process = Start-Process -FilePath $path -ArgumentList "--self-test-paddlex-pipeline" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "El EXE no pudo cargar la pipeline OCR de PaddleX (ExitCode=$($process.ExitCode))."
          }

      - name: Verify executable and release manifest
        shell: pwsh
        run: |
          $path = "dist/Extractor_de_Movimientos_Financieros.exe"
          python scripts/verify_windows_release.py $path --output-dir dist --version "2.4.1"

      - name: Upload build evidence
        uses: actions/upload-artifact@v4
        with:
          name: desktop-build-evidence
          path: |
            dist/Extractor_de_Movimientos_Financieros.sha256.txt
            dist/release-manifest.json
          if-no-files-found: error
          retention-days: 30