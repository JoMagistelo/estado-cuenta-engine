name: Apply temporary Paddle adaptive performance hotfix

on:
  push:
    branches:
      - fix/v2.4.1-paddle-adaptive-performance
    paths:
      - '.github/workflows/_apply_paddle_adaptive_perf_patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2.4.1-paddle-adaptive-performance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply patch
        run: python scripts/_apply_paddle_adaptive_perf_patch.py
      - name: Compile changed files
        run: python -m py_compile src/readers/paddleocr_pdf_reader.py src/readers/cancelable_ocr_reader.py scripts/preparar_modelos_paddleocr.py tests/readers/test_paddleocr_pdf_reader.py
      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/readers/paddleocr_pdf_reader.py src/readers/cancelable_ocr_reader.py scripts/preparar_modelos_paddleocr.py tests/readers/test_paddleocr_pdf_reader.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix: restore PaddleOCR 3.2 accelerated backend with safe recovery'
          git push origin HEAD:fix/v2.4.1-paddle-adaptive-performance
