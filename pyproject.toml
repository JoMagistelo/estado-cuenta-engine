[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "extractor-de-movimientos-financieros"
version = "1.0"
description = "Motor institucional para lectura, extracción, validación y exportación de estados de cuenta."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "openpyxl>=3.1.5,<4",
    "pdfplumber>=0.11.9,<0.12",
    "Pillow>=12.1.1,<13",
    "pypdfium2>=5.6,<6",
    "pytesseract>=0.3.13,<0.4",
]

[project.optional-dependencies]
streamlit = [
    "pandas>=3.0,<4",
    "streamlit>=1.55,<2",
]
desktop = [
    "flet>=0.86.5,<0.87",
]

[dependency-groups]
dev = [
    "build>=1.3,<2",
    "pip-audit>=2.9,<3",
    "pytest>=9,<10",
    "ruff>=0.14,<1",
]
packaging = [
    "pyinstaller>=6.19,<7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
markers = [
    "integration: pruebas opt-in que requieren PDFs locales autorizados",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
